<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <style>
    :root { color-scheme: light dark; --muted: #6b7280; --line: #d1d5db55; --accent: #2563eb; --error: #dc2626; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 64rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin: 0 0 .25rem; }
    .tagline, .meta, .path, .copies { color: var(--muted); }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input { flex: 1; font: inherit; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: .375rem; }
    button { font: inherit; padding: .5rem 1rem; border: 0; border-radius: .375rem; background: var(--accent); color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    #status.error, #repository-status.error { color: var(--error); }
    main.organization { display: grid; margin-top: .75rem; grid-template-columns: minmax(10rem, 16rem) 1fr; gap: 1.5rem; align-items: start; }
    #repositories { margin: 0; border-right: 1px solid var(--line); max-height: 80vh; overflow-y: auto; }
    #repositories button { display: block; width: 100%; text-align: left; background: none; color: inherit; padding: .375rem .5rem; overflow-wrap: anywhere; }
    #repositories button[aria-current="true"] { background: var(--accent); color: white; }
    ul { list-style: none; padding: 0; }
    #skills li { padding: .75rem 0; border-top: 1px solid var(--line); }
    #skills h2 { font-size: 1.05rem; margin: 0; }
    #skills p { margin: .25rem 0; }
    .path, .copies { font-size: .85rem; overflow-wrap: anywhere; }
    #warnings li { color: var(--muted); font-size: .85rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Skill Atlas</h1>
  <div class="tagline">Every agent skill in a GitHub repository or organization.</div>
  <form>
    <input name="url" type="text" required autofocus placeholder="https://github.com/JetBrains/kotlin" aria-label="GitHub repository or organization URL">
    <button type="submit">Scan</button>
  </form>
  <div id="status" role="status"></div>
  <main>
    <ul id="repositories" aria-label="Repositories" hidden></ul>
    <section>
      <div id="repository-status" role="status" hidden></div>
      <ul id="skills"></ul>
      <ul id="warnings"></ul>
    </section>
  </main>
  <script type="module">
    const form = document.querySelector('form');
    const input = form.elements.url;
    const button = form.querySelector('button');
    const status = document.querySelector('#status');
    const skills = document.querySelector('#skills');
    const warnings = document.querySelector('#warnings');
    const main = document.querySelector('main');
    const repositories = document.querySelector('#repositories');
    const repositoryStatus = document.querySelector('#repository-status');
    /** The latest scan; an older answer that arrives later is dropped. */
    let latest = 0;

    /** An element with text content only: what GitHub returns is never parsed as HTML. */
    function element(tag, text, attributes = {}) {
      const node = Object.assign(document.createElement(tag), attributes);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function show(message, isError = false, target = status) {
      target.className = isError ? 'error' : '';
      target.replaceChildren(message);
    }

    /** `github.com/<organization>`: the same rule as the server's. */
    const isOrganization = (url) => /^(?:https?:\/\/)?(?:www\.)?github\.com\/[\w.-]+\/?$/i.test(url);

    /** The API's answer or error; the caller owns when it may update the page. */
    async function get(path, url) {
      try {
        const response = await fetch(`${path}?url=${encodeURIComponent(url)}`);
        const answer = await response.json();
        return response.ok ? { answer } : { error: answer.error };
      } catch (error) {
        return { error: `Cannot reach Skill Atlas: ${error.message}` };
      }
    }

    function clear() {
      latest++;
      skills.replaceChildren();
      warnings.replaceChildren();
      repositories.replaceChildren();
      repositories.hidden = true;
      repositoryStatus.hidden = true;
      main.className = '';
    }

    async function open(url) {
      clear();
      button.disabled = true;
      try {
        if (isOrganization(url)) await scanOrganization(url);
        else await scanRepository(url, status);
      } finally {
        button.disabled = false;
      }
    }

    /** The repository's skills, with its summary in `target`. */
    async function scanRepository(url, target) {
      const scan = ++latest;
      skills.replaceChildren();
      warnings.replaceChildren();
      show('Scanning…', false, target);
      const result = await get('api/scan', url);
      if (scan !== latest) return;
      if ('error' in result) return show(result.error, true, target);
      render(result.answer, target);
    }

    /** The organization's repositories on the left; the selected one's skills on the right. */
    async function scanOrganization(url) {
      const current = latest;
      show('Loading repositories…');
      const result = await get('api/organization', url);
      if (current !== latest) return;
      if ('error' in result) return show(result.error, true);
      const answer = result.answer;
      const summary = element('span');
      const count = answer.repositories.length;
      summary.append(element('a', answer.id, { href: answer.url }), ` · ${count} ${count === 1 ? 'repository' : 'repositories'}`);
      show(summary);
      if (count === 0) return;
      main.className = 'organization';
      repositories.hidden = false;
      repositoryStatus.hidden = false;
      show('Select a repository to see its skills.', false, repositoryStatus);
      for (const repository of answer.repositories) {
        const choice = element('button', repository.name, { type: 'button', title: repository.description || repository.id });
        choice.addEventListener('click', () => {
          for (const other of repositories.querySelectorAll('button')) other.setAttribute('aria-current', String(other === choice));
          scanRepository(repository.url, repositoryStatus);
        });
        const item = element('li');
        item.append(choice);
        repositories.append(item);
      }
    }

    function render({ repository, skills: found, warnings: notes }, target) {
      const summary = element('span');
      summary.append(
        element('a', repository.id, { href: repository.url }),
        ` · ${found.length} ${found.length === 1 ? 'skill' : 'skills'}`,
        element('span', ` at ${repository.commit.slice(0, 7)}`, { className: 'meta' }),
      );
      show(summary, false, target);
      if (found.length === 0) skills.append(element('li', `No skills in ${repository.id}.`, { className: 'meta' }));
      for (const skill of found) {
        const item = element('li');
        const title = element('h2');
        title.append(element('a', skill.name, { href: skill.link }));
        item.append(title);
        if (skill.description) item.append(element('p', skill.description));
        item.append(element('div', skill.path, { className: 'path' }));
        if (skill.copies.length > 0) item.append(element('div', `also in ${skill.copies.join(', ')}`, { className: 'copies' }));
        skills.append(item);
      }
      for (const note of notes) warnings.append(element('li', `warning: ${note}`));
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const url = input.value.trim();
      // The scanned URL stays in the address bar, so a scan can be shared.
      history.pushState(null, '', `?url=${encodeURIComponent(url)}`);
      open(url);
    });

    function fromAddress() {
      const url = new URLSearchParams(location.search).get('url');
      if (url) { input.value = url; open(url); }
    }
    addEventListener('popstate', fromAddress);
    fromAddress();
  </script>
</body>
</html>
