# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Pinned: the screenshot baselines are made on Ubuntu 24.04 (spec/screenshots).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:browser
      # The demo as screenshot tests: a changed pixel fails; every test is recorded on video.
      - run: npm run e2e
      - name: Changed screenshots
        if: failure()
        run: npm run -s screenshots -- summary >> "$GITHUB_STEP_SUMMARY"
      - name: Videos, and expected / actual / diff of each changed screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
